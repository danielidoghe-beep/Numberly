<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Numberly</title>

    <link rel="stylesheet" href="forgot-password.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <img src="images/logo.png" alt="Numberly Logo">

            <span>Numberly</span>

        </div>

        <div class="header-icons">

            <button id="themeToggle" class="icon-btn">

                <i class="fa-regular fa-moon"></i>

            </button>

            <button id="menuBtn" class="icon-btn">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </header>

    <div class="header-line"></div>

    <!-- MAIN -->

    <main class="container">

        <h1>Reset password</h1>

        <p class="subtitle">

            Enter your registered email and we'll send you a 6-digit reset code.

        </p>

        <!-- SUCCESS / ERROR MESSAGE -->

        <div id="resetMessage" class="message"></div>

        <!-- FORM -->

        <form id="resetForm">

            <div class="input-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>

            </div>

            <button
                type="submit"
                id="resetBtn"
                class="reset-btn">

                Send reset code

            </button>

        </form>

        <a href="login.html" class="back-link">

            <i class="fa-solid fa-arrow-left-long"></i>

            <span>Back to sign in</span>

        </a>

    </main>

    <script type="module" src="forgot-password.js"></script>

</body>

</html>
